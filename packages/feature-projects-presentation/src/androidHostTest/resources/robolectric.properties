# A phone, not Robolectric's default device.
#
# Without this file the host lays every composition out at the default qualifier, which is
# narrower and shorter than any phone this app ships on. LazyColumn items past that smaller
# fold are never composed, so tests fail with "could not find any node" and read as product
# defects. The size below is a Pixel-class phone: 411dp wide, 891dp tall.
sdk=34
qualifiers=w411dp-h891dp
