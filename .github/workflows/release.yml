name: release

# Runs only on tag push (v*) or manual dispatch — not on every push to main.
# Builds Android APK, iOS archive, and Desktop native packages, then creates a GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create (e.g., v1.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Accept the Android SDK licences
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Point Gradle at the runner's JDK, apply the tuning flags
        run: echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties && for prop in org.gradle.parallel=true org.gradle.caching=true org.gradle.configuration-cache=true; do grep -qx "$prop" gradle.properties || echo "$prop" >> gradle.properties; done

      - name: Build Android debug APK (release signing needs keystore setup)
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  desktop:
    name: Build Desktop Native Packages (Linux/Windows)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Point Gradle at the runner's JDK, apply the tuning flags
        run: echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties && for prop in org.gradle.parallel=true org.gradle.caching=true org.gradle.configuration-cache=true; do grep -qx "$prop" gradle.properties || echo "$prop" >> gradle.properties; done

      - name: "Build Desktop native packages (Linux: deb, Windows: msi)"
        run: ./gradlew :shared-ui:packageDeb :shared-ui:packageMsi --no-daemon --stacktrace

      - name: Upload Desktop native packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-native
          path: |
            shared-ui/build/compose/binaries/main/deb/*.deb
            shared-ui/build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn

  desktop-macos:
    name: Build Desktop Native Package (macOS .dmg)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Point Gradle at the runner's JDK, apply the tuning flags
        run: echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties && for prop in org.gradle.parallel=true org.gradle.caching=true org.gradle.configuration-cache=true; do grep -qx "$prop" gradle.properties || echo "$prop" >> gradle.properties; done

      - name: "Build Desktop native package (macOS: dmg)"
        run: ./gradlew :shared-ui:packageDmg --no-daemon --stacktrace

      - name: Upload Desktop native package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dmg
          path: shared-ui/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: warn

  ios:
    name: Build iOS for Simulator (arm64)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/libs.versions.toml') }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Point Gradle at the runner's JDK, apply the tuning flags
        run: echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties && for prop in org.gradle.parallel=true org.gradle.caching=true org.gradle.configuration-cache=true; do grep -qx "$prop" gradle.properties || echo "$prop" >> gradle.properties; done

      - name: Generate Xcode project
        run: cd iosApp && xcodegen generate

      - name: Build iOS for arm64 simulator
        run: |
          cd iosApp
          xcodebuild -project TaskTracker.xcodeproj \
            -scheme TaskTracker \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            build

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: iosApp/build/
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: [android, desktop, desktop-macos, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android
        continue-on-error: true

      - name: Download Desktop native packages (Linux/Windows)
        uses: actions/download-artifact@v4
        with:
          name: desktop-native
          path: artifacts/desktop
        continue-on-error: true

      - name: Download Desktop .dmg (macOS)
        uses: actions/download-artifact@v4
        with:
          name: desktop-dmg
          path: artifacts/desktop
        continue-on-error: true

      - name: Download iOS build
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: artifacts/ios
        continue-on-error: true

      - name: List artifacts
        run: |
          echo "Android artifacts:"
          ls -la artifacts/android/ || true
          echo "Desktop artifacts:"
          ls -la artifacts/desktop/ || true
          echo "iOS artifacts:"
          ls -la artifacts/ios/ || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TaskTracker ${{ github.ref_name }}
          body: |
            ## TaskTracker ${{ github.ref_name }}

            ### Downloads

            | Platform | File |
            |----------|------|
            | Android (APK, debug) | `tasktracker-android-${{ github.ref_name }}.apk` |
            | iOS (simulator build) | See iOS build artifacts (may be unavailable) |
            | macOS (DMG) | `TaskTracker-${{ github.ref_name }}.dmg` |
            | Windows (MSI) | `TaskTracker-${{ github.ref_name }}.msi` |
            | Linux (DEB) | `TaskTracker-${{ github.ref_name }}.deb` |

            ### Installation

            **Android:** Download the APK and install on your device. Enable "Install from unknown sources" if needed. *This is a debug build.*

            **iOS:** This build is for iOS Simulator only. For device installation, configure code signing and create an archive in Xcode. *iOS build may be unavailable due to configuration issues.*

            **macOS:** Download the `.dmg`, open it, and drag TaskTracker to Applications.

            **Windows:** Download the `.msi` and run it to install.

            **Linux:** Download the `.deb` and install with `sudo dpkg -i TaskTracker-*.deb` (Ubuntu/Debian).

            ### Server Compatibility

            This release works with TaskTrackerServer at the same version tag.
            See [TaskTrackerServer releases](https://github.com/amirashouri/TaskTrackerServer/releases/tag/${{ github.ref_name }}).

          files: |
            artifacts/android/*.apk
            artifacts/ios/**/*
            artifacts/desktop/*.dmg
            artifacts/desktop/*.msi
            artifacts/desktop/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
