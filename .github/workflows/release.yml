name: release

# Runs only on tag push (v*) or manual dispatch — not on every push to main.
# Builds Android APK, iOS archive, and Desktop native packages, then creates a GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create (e.g., v1.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # One tag for every job. On a tag run `inputs.version` is empty and this is the
  # pushed tag; on a manual run it is the requested tag — before this, a dispatch
  # from main used `github.ref_name`, i.e. `main`, as the release tag.
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Accept the Android SDK licences
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Point Gradle at the runner's JDK, apply the tuning flags
        run: echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties && for prop in org.gradle.parallel=true org.gradle.caching=true org.gradle.configuration-cache=true; do grep -qx "$prop" gradle.properties || echo "$prop" >> gradle.properties; done

      - name: Build Android debug APK (release signing needs keystore setup)
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  desktop:
    name: Build Desktop Native Package (Linux .deb)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Point Gradle at the runner's JDK, apply the tuning flags
        run: echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties && for prop in org.gradle.parallel=true org.gradle.caching=true org.gradle.configuration-cache=true; do grep -qx "$prop" gradle.properties || echo "$prop" >> gradle.properties; done

      # Only .deb: `jpackage` builds an installer only for the host OS it runs on,
      # so an MSI cannot be produced here — that is the desktop-windows job. The
      # version property is the tag without its `v`, because Debian and jpackage
      # want a version that starts with a digit.
      - name: "Build Desktop native package (Linux: deb)"
        run: ./gradlew :shared-ui:packageDeb --no-daemon --stacktrace -PtasktrackerVersion="${RELEASE_TAG#v}"

      - name: Upload Desktop .deb package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-deb
          path: shared-ui/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

  desktop-windows:
    name: Build Desktop Native Package (Windows .msi)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Point Gradle at the runner's JDK, apply the tuning flags
        shell: bash
        run: echo "org.gradle.java.home=$(cygpath -m "$JAVA_HOME")" >> gradle.properties && for prop in org.gradle.parallel=true org.gradle.caching=true org.gradle.configuration-cache=true; do grep -qx "$prop" gradle.properties || echo "$prop" >> gradle.properties; done

      # The Compose plugin fetches the WiX toolset `jpackage` needs for an MSI.
      - name: "Build Desktop native package (Windows: msi)"
        shell: bash
        run: ./gradlew :shared-ui:packageMsi --no-daemon --stacktrace -PtasktrackerVersion="${RELEASE_TAG#v}"

      - name: Upload Desktop .msi package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-msi
          path: shared-ui/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  desktop-macos:
    name: Build Desktop Native Package (macOS .dmg)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Point Gradle at the runner's JDK, apply the tuning flags
        run: echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties && for prop in org.gradle.parallel=true org.gradle.caching=true org.gradle.configuration-cache=true; do grep -qx "$prop" gradle.properties || echo "$prop" >> gradle.properties; done

      # `packageDmg` exists because `:shared-ui` declares
      # `nativeDistributions.targetFormats(TargetFormat.Dmg, ...)`; Compose 1.12
      # registers one packaging task per declared format and defaults the set to
      # empty, which is why this step used to fail with "task 'packageDmg' not
      # found in project ':shared-ui'". Output: TaskTracker-<version>.dmg.
      - name: "Build Desktop native package (macOS: dmg)"
        run: ./gradlew :shared-ui:packageDmg --no-daemon --stacktrace -PtasktrackerVersion="${RELEASE_TAG#v}"

      - name: Upload Desktop .dmg package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dmg
          path: shared-ui/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  ios:
    name: Build iOS for Simulator (arm64)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/libs.versions.toml') }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Point Gradle at the runner's JDK, apply the tuning flags
        run: echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties && for prop in org.gradle.parallel=true org.gradle.caching=true org.gradle.configuration-cache=true; do grep -qx "$prop" gradle.properties || echo "$prop" >> gradle.properties; done

      - name: Generate Xcode project
        run: cd iosApp && xcodegen generate

      - name: Build iOS for arm64 simulator
        run: |
          cd iosApp
          xcodebuild -project TaskTracker.xcodeproj \
            -scheme TaskTracker \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            build

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: iosApp/build/
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: [android, desktop, desktop-windows, desktop-macos, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # One download for every job's artifact, into `artifacts/<artifact-name>/`.
      # Individual downloads (one per artifact) meant a single missing artifact
      # silently removed a whole platform from the release.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      # The published file names are set here, in one place, from the tag — the
      # build jobs publish whatever name their packager chose
      # (`TaskTracker-0.1.6.dmg`, `androidApp-debug.apk`). Every asset is then
      # linked from the same list, so a link cannot point at a file that is not
      # attached.
      - name: Stage release assets
        env:
          # `download-artifact` keys each directory by artifact *name*, so these
          # have to match the upload steps above. `android-apk` did not, and the
          # APK was silently dropped from v0.1.7's release while its job was green.
          ANDROID_RESULT: ${{ needs.android.result }}
          DEB_RESULT: ${{ needs.desktop.result }}
          MSI_RESULT: ${{ needs.desktop-windows.result }}
          DMG_RESULT: ${{ needs.desktop-macos.result }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets

          for f in artifacts/android-apk/*.apk; do
            cp "$f" "release-assets/tasktracker-android-${RELEASE_TAG}.apk"
          done
          for f in artifacts/desktop-deb/*.deb; do
            cp "$f" "release-assets/TaskTracker-${RELEASE_TAG}.deb"
          done
          for f in artifacts/desktop-msi/*.msi; do
            cp "$f" "release-assets/TaskTracker-${RELEASE_TAG}.msi"
          done
          for f in artifacts/desktop-dmg/*.dmg; do
            cp "$f" "release-assets/TaskTracker-${RELEASE_TAG}.dmg"
          done

          echo "Staged assets:"
          ls -la release-assets

          # A green build job that produced no asset means a path in this script is
          # wrong, not that the platform was skipped — fail instead of publishing a
          # release that quietly lost a platform.
          require() {
            if [ "$1" = "success" ] && [ ! -e "$2" ]; then
              echo "::error::$3 finished successfully but no asset was staged at $2"
              exit 1
            fi
          }
          require "$ANDROID_RESULT" "release-assets/tasktracker-android-${RELEASE_TAG}.apk" "Android APK"
          require "$DEB_RESULT" "release-assets/TaskTracker-${RELEASE_TAG}.deb" "Linux DEB"
          require "$MSI_RESULT" "release-assets/TaskTracker-${RELEASE_TAG}.msi" "Windows MSI"
          require "$DMG_RESULT" "release-assets/TaskTracker-${RELEASE_TAG}.dmg" "macOS DMG"

      - name: Compose the release body
        run: |
          set -euo pipefail
          shopt -s nullglob
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # The version `:shared-ui` actually packaged, derived the same way the build
          # script derives it: `jpackage` rejects a macOS bundle version whose first
          # number is 0, so a zero major becomes 1 (`v0.1.7` -> `1.1.7`).
          INSTALLER_VERSION="${RELEASE_TAG#v}"
          case "${INSTALLER_VERSION}" in
            0.*) INSTALLER_VERSION="1.${INSTALLER_VERSION#0.}" ;;
          esac

          assets=(release-assets/*)
          {
            echo "## TaskTracker ${RELEASE_TAG}"
            echo
            echo "### Downloads"
            echo
            if [ ${#assets[@]} -eq 0 ]; then
              echo "_No binary artifacts were produced by this run._ See the [workflow run](${RUN_URL}) for logs."
            else
              echo "| Platform | File |"
              echo "|----------|------|"
              for f in "${assets[@]}"; do
                name="$(basename "$f")"
                case "$name" in
                  *android*.apk) label="Android (APK, debug)" ;;
                  *.dmg)         label="macOS (DMG)" ;;
                  *.msi)         label="Windows (MSI)" ;;
                  *.deb)         label="Linux (DEB)" ;;
                  *)             label="Other" ;;
                esac
                echo "| ${label} | [${name}](${BASE}/${name}) |"
              done
            fi
            echo
            echo "### Installation"
            echo
            echo "**Android:** Download the APK and install on your device. Enable \"Install from unknown sources\" if needed. *This is a debug build.*"
            echo
            echo "**macOS:** Download the \`.dmg\`, open it, and drag TaskTracker to Applications. The build is not notarized, so the first launch needs right-click → Open."
            echo
            echo "**iOS:** The simulator build is not attached to the release; download it from the [workflow run](${RUN_URL}) artifacts. For device installation, configure code signing and create an archive in Xcode."
            echo
            echo "**Windows:** Download the \`.msi\` and run it to install."
            echo
            echo "**Linux:** Download the \`.deb\` and install with \`sudo apt install ./TaskTracker-${RELEASE_TAG}.deb\` (Ubuntu/Debian)."
            echo
            if [ "${INSTALLER_VERSION}" != "${RELEASE_TAG#v}" ]; then
              echo "The desktop installers report version \`${INSTALLER_VERSION}\`, not \`${RELEASE_TAG#v}\`: \`jpackage\` refuses a macOS bundle version whose first number is 0, so a zero major is bumped to 1. The asset name keeps the tag."
              echo
            fi
            echo "### Not in this run"
            echo
            missing=()
            [ -e "release-assets/tasktracker-android-${RELEASE_TAG}.apk" ] || missing+=("Android (APK)")
            [ -e "release-assets/TaskTracker-${RELEASE_TAG}.dmg" ] || missing+=("macOS (DMG)")
            [ -e "release-assets/TaskTracker-${RELEASE_TAG}.msi" ] || missing+=("Windows (MSI)")
            [ -e "release-assets/TaskTracker-${RELEASE_TAG}.deb" ] || missing+=("Linux (DEB)")
            if [ ${#missing[@]} -eq 0 ]; then
              echo "Every platform was built."
            else
              joined="$(printf '%s, ' "${missing[@]}")"
              echo "Failed or skipped: ${joined%, }."
            fi
            echo
            echo "### Server Compatibility"
            echo
            echo "This release works with the server at the same version tag, where that release exists."
            echo "Server releases: [amirashouri/TaskTracker releases](https://github.com/amirashouri/TaskTracker/releases)."
          } > release-body.md

          cat release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TaskTracker ${{ env.RELEASE_TAG }}
          body_path: release-body.md
          fail_on_unmatched_files: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
