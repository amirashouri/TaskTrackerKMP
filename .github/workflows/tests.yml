name: tests

# On demand and nightly; deliberately not on every push. PRs are verified with focused
# JVM unit tests, and `scripts/check.sh` is the release gate (see `AGENTS.md`); this
# matrix is the cross-host backstop for main. Measured on run 39042728812: a cold iOS leg is
# 35m04s and a cache-warm one ~15m, against ~5-6m for JVM and Android. That is wall
# clock in front of every commit, which is the cost — the repository is public, so the
# Actions minutes were never billed.
on:
  workflow_dispatch:
  schedule:
    # 04:17 UTC: off the hour, so the run does not queue behind the top-of-hour cron spike.
    - cron: '17 4 * * *'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: JVM + architecture graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # The ubuntu image already ships a complete Android SDK at
      # /usr/local/lib/android/sdk with ANDROID_HOME set. `android-actions/setup-android@v3`
      # re-downloads cmdline-tools and then runs `sdkmanager --licenses`, whose "(y/N)?"
      # prompt it fails to answer on this image, exiting the job before Gradle runs. Accept
      # the licences directly instead; AGP then auto-downloads the compileSdk platform.
      - name: Accept the Android SDK licences
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Restore-only off main, per the action's guidance: a PR build reads the cache
          # main produced, but never replaces the entry main's builds will restore.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Same keys as the committed gradle.properties; the guard keeps this append
      # idempotent so a CI layout that lacks them gains them without duplicating keys.
      - name: Point Gradle at the runner's JDK, apply the tuning flags
        run: |
          echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties
          for prop in org.gradle.parallel=true org.gradle.caching=true org.gradle.configuration-cache=true; do
            grep -qx "$prop" gradle.properties || echo "$prop" >> gradle.properties
          done

      - name: JVM tests, graph, baseline
        run: ./scripts/check.sh fast

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-results
          path: |
            **/build/test-results/jvmTest/*.xml
            build/reports/test-summary.md
          if-no-files-found: warn

  android-host:
    name: Android host (Robolectric)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # The ubuntu image already ships a complete Android SDK at
      # /usr/local/lib/android/sdk with ANDROID_HOME set. `android-actions/setup-android@v3`
      # re-downloads cmdline-tools and then runs `sdkmanager --licenses`, whose "(y/N)?"
      # prompt it fails to answer on this image, exiting the job before Gradle runs. Accept
      # the licences directly instead; AGP then auto-downloads the compileSdk platform.
      - name: Accept the Android SDK licences
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Restore-only off main, per the action's guidance: a PR build reads the cache
          # main produced, but never replaces the entry main's builds will restore.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Same keys as the committed gradle.properties; the guard keeps this append
      # idempotent so a CI layout that lacks them gains them without duplicating keys.
      - name: Point Gradle at the runner's JDK, apply the tuning flags
        run: |
          echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties
          for prop in org.gradle.parallel=true org.gradle.caching=true org.gradle.configuration-cache=true; do
            grep -qx "$prop" gradle.properties || echo "$prop" >> gradle.properties
          done

      - name: Android host tests + baseline
        run: ./scripts/check.sh android

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            **/build/test-results/testAndroidHostTest/*.xml
            build/reports/test-summary.md
          if-no-files-found: warn

  ios:
    name: iOS simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # setup-gradle caches the Gradle build cache, not the Kotlin/Native toolchain, so
      # every run re-downloaded the Kotlin/Native distribution and re-compiled the
      # platform libs. Measured on run 39042728812 with ~/.konan cold: the iOS leg ran
      # 34m07s against 6m54s for JVM and 6m01s for Android. The version catalog is the
      # only file that moves the toolchain version, so it is the key's input.
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/libs.versions.toml') }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Restore-only off main, per the action's guidance: a PR build reads the cache
          # main produced, but never replaces the entry main's builds will restore.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Same keys as the committed gradle.properties; the guard keeps this append
      # idempotent so a CI layout that lacks them gains them without duplicating keys.
      - name: Point Gradle at the runner's JDK, apply the tuning flags
        run: |
          echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties
          for prop in org.gradle.parallel=true org.gradle.caching=true org.gradle.configuration-cache=true; do
            grep -qx "$prop" gradle.properties || echo "$prop" >> gradle.properties
          done

      - name: Boot a simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit }')
          echo "booting: $DEVICE"
          xcrun simctl boot "$DEVICE" || true

      - name: iOS simulator tests + baseline
        run: ./scripts/check.sh ios

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            **/build/test-results/iosSimulatorArm64Test/*.xml
            build/reports/test-summary.md
          if-no-files-found: warn
