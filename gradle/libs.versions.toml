[versions]
# Kotlin 2.3.20 is required, not optional: KSP 2.3.12's POM pins
# kotlin-stdlib 2.3.20, and Compose Multiplatform 1.12.x requires
# Kotlin 2.3 for its native (iOS) targets.
kotlin = "2.3.20"
ksp = "2.3.12"

agp = "9.4.1"
composeMultiplatform = "1.12.1"
# Material3 and the extended icon set are versioned on their own track and do
# not track the CMP release: material3 is still alpha while runtime/foundation
# ship stable, and material-icons-extended last published at 1.7.3. They are
# pinned separately so a CMP bump does not silently move them.
composeMaterial3 = "1.12.0-alpha03"
composeMaterialIcons = "1.7.3"

# Room 2.8.4 is the last stable line (Room 3.x is alpha). It depends on
# androidx.sqlite 2.6.2, so the bundled driver is pinned to the same version
# to keep a single SQLite native library on the classpath.
room = "2.8.4"
sqlite = "2.6.2"

ktor = "3.6.0"
koin = "4.2.2"

# The compose-local API `BackHandler` registers with. `ui-backhandler`
# depends on this at *runtime* scope only, so a module that imports the
# `LocalNavigationEventDispatcherOwner` compose local needs it as a
# compile dependency of its own. Pinned to the version `ui-backhandler`
# 1.12.1 asks for.
navigationevent = "1.1.0"

# JNA, for `:packages:keychain`'s macOS actual only. `Security.framework` is a C API and
# the JDK has no binding to it, so real OS-keychain storage on Desktop is unreachable
# without either a native call or shelling out to `/usr/bin/security`. This is a
# JVM-only library edge: `verifyArchitectureGraph` filters `ProjectDependency`, and
# neither it nor `verifyModuleImports` reads a `libs.` coordinate, so no table changes.
jna = "5.17.0"

coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
atomicfu = "0.29.0"

androidxLifecycle = "2.11.0"
androidxActivityCompose = "1.12.0"
androidxCoreKtx = "1.19.0"

junit = "4.13.2"
turbine = "1.2.1"
robolectric = "4.16.1"

androidCompileSdk = "37"
androidMinSdk = "26"
androidTargetSdk = "37"

[libraries]
# --- Kotlin / coroutines ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }

# --- Room KMP ---
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# --- Ktor ---
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# --- DI ---
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

# --- Compose Multiplatform ---
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-materialIconsExtended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "composeMaterialIcons" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-uiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
# System-back consumption for the signed-in shell. `BackHandler` is the
# Compose Multiplatform 1.12 API that registers with the host's
# `NavigationEventDispatcher` — on Android that is the activity's own back
# dispatcher, so the handler rides the real system-back chain. It carries a
# deprecation pointing at `NavigationEventHandler`; that replacement is the
# same wiring without the annotation, and the shell moves to it when the rest
# of its navigation-event consumers do.
compose-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }
navigationevent-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "navigationevent" }
# `androidx`, not `org.jetbrains.compose.ui`. The JetBrains coordinate was never published
# for any version -- `org.jetbrains.compose.ui:ui-test-manifest` 404s on Maven Central -- so
# the `org.jetbrains.compose.ui:ui-test` dependency is a dead end for the Android host's
# manifest. The androidx artifact is the one Compose Multiplatform's `ui-test-android`
# itself builds on, and 1.12.1 lines up with `composeMultiplatform`.
compose-testManifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "composeMultiplatform" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }

androidx-lifecycle-runtime = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }

# --- Test ---
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# --- Native interop ---
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }

# --- Plugin markers, so convention plugins can alias them ---
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
kotlin-composeCompilerPlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
room-gradlePlugin = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
