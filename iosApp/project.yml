name: TaskTracker

# XcodeGen manifest for the iOS shell. The generated `TaskTracker.xcodeproj` is never
# hand-edited and is not committed - run `xcodegen generate` from this directory.
#
# This mirrors `project.yml` in the original Swift project, with one structural
# difference: there, the app was built from SwiftPM packages resolved by path. Here the
# app is a thin shell over a Kotlin Multiplatform static framework that Gradle builds
# (`ComposeApp`, declared in `shared-ui/build.gradle.kts`) and that this project links
# as a binary. The script phase below is what makes `xcodebuild` and Gradle agree; see
# the note on its ordering.

options:
  bundleIdPrefix: com.tasktracker
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Root files worth opening from the navigator but belonging to no target. Xcode only
# shows what the project file references, so without this the repo's own documentation
# and this manifest are invisible in Xcode, and the first sign of it is a hand-edit to
# project.pbxproj that the next `xcodegen generate` silently discards. The original
# project records the same lesson at project.yml:10-15.
fileGroups:
  - ../docs/DECISIONS.md
  - project.yml

targets:
  TaskTracker:
    type: application
    platform: iOS
    sources:
      - path: TaskTracker
        excludes:
          - "**/.DS_Store"
    dependencies:
      # The KMP framework. XcodeGen cannot express "the output of a Gradle task", so
      # this is a framework search path plus the script phase below that produces it.
      # The path is the one `shared-ui/build.gradle.kts` writes to; if baseName changes,
      # it changes here too.
      - framework: ../shared-ui/build/bin/iosSimulatorArm64/debugFramework/ComposeApp.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tasktracker.app
        PRODUCT_NAME: TaskTracker
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The API root the app talks to, read from Info.plist's `TaskTrackerApiBaseUrl` by
        # `platformApiBaseUrl` in :composition-root. Left empty so the Kotlin fallback
        # (http://localhost:8080, which the simulator reaches on the host) is the one place
        # the default lives. A deployment names its own server here, or on the command line:
        #
        #   xcodebuild -scheme TaskTracker TASKTRACKER_API_BASE_URL=https://server.example.com
        TASKTRACKER_API_BASE_URL: ""
        # The Kotlin link task writes the simulator framework here. Keeping both Xcode's
        # framework reference and search path aligned with that output lets Swift resolve
        # `import ComposeApp` after the pre-build Gradle task completes.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared-ui/build/bin/iosSimulatorArm64/debugFramework
      configs:
        Debug:
          # Only arm64 is built: the Kotlin convention plugin deliberately omits iosX64
          # because Compose Multiplatform 1.12.1 publishes no Intel simulator variants.
          # Building for both would make every native dependency unresolvable.
          ONLY_ACTIVE_ARCH: YES
        Release:
          ONLY_ACTIVE_ARCH: NO
    preBuildScripts:
      # Runs before compilation so the framework the linker is about to read exists.
      #
      # `basedOnDependencyAnalysis: false` is required, not a nicety. Xcode would
      # otherwise decide from the script's declared inputs that it has nothing to do
      # and skip it, leaving a stale or missing framework for the build to fail on in a
      # way that points at the linker rather than at Gradle. The only input that matters
      # is the Kotlin source tree, and Gradle decides for itself what to recompile.
      #
      # `--console=plain` keeps the log free of carriage returns, which is what makes
      # `xcodegen generate && xcodebuild` readable in a terminal.
      - name: Build ComposeApp
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          export JAVA_HOME="${JAVA_HOME:-/Applications/Android Studio.app/Contents/jbr/Contents/Home}"
          # Both tasks below run on every path — Xcode, `xcodebuild`, and Android Studio alike.
          #
          # This used to skip the link when `OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED` was YES,
          # on the assumption recorded here: that "Android Studio's KMP run configuration builds
          # the framework before invoking Xcode, so the (expensive) link below is redundant on
          # that path". That assumption was false, and it was false silently. The IDE run
          # configuration at `.idea/runConfigurations/TaskTracker.xml` declares no Gradle
          # before-run task at all — only Xcode's own `BuildBeforeRunTask` — so on the IDE path
          # nothing linked the framework and the resource sync was all that ran.
          #
          # The result was an app built from a framework binary that predated the current
          # sources. `shared-ui/build/bin/iosSimulatorArm64/debugFramework/ComposeApp` was hours
          # older than the Kotlin it was supposed to contain, and contained no trace of it:
          # `strings` for a resource added that afternoon found zero hits. Nothing said so,
          # because a stale link is a successful link. Deleting the installed app and
          # re-running `xcodegen generate` cannot change this — both rewrite things that sit
          # downstream of the artifact that was actually stale, which is why that loop kept
          # reproducing the same crash.
          #
          # The "expensive" saving is also smaller than it looks: Gradle's up-to-date checks
          # make a link with no changed input close to free, and the link has to happen
          # *somewhere* for the binary to be trustworthy. Doing it in one place that every
          # path already runs is what makes it trustworthy.
          #
          # `syncComposeResourcesForIos` was always needed on the IDE path and still is: the
          # task reads BUILT_PRODUCTS_DIR and UNLOCALIZED_RESOURCES_FOLDER_PATH, which Android
          # Studio does not supply to its own Gradle invocation, so this script phase is the
          # only place the .cvr blobs can land in the bundle. Skipping it is why the IDE run
          # used to crash on the first frame with MissingResourceException while a plain Xcode
          # run worked.
          # `syncComposeResourcesForIos` is not optional and is not about tests. Linking the
          # framework is only half of what this phase exists for: the other half is copying the
          # `.cvr` blobs into the app bundle, which the linker does nothing for and which is why
          # its absence is invisible until the first frame.
          #
          # Without it the app crashed on launch with
          #
          #   MissingResourceException: Missing resource with path:
          #   <app>/compose-resources/composeResources/com.tasktracker.resources/values/strings.commonMain.cvr
          #
          # thrown from `stringResource` during composition, i.e. an uncaught Kotlin exception on
          # the main thread. The bundle had no `compose-resources` directory in it at all, and the
          # message names only that absent path - nothing about a build phase, so the crash points
          # nowhere near the cause.
          #
          # The task's output directory is not configurable: it reads `BUILT_PRODUCTS_DIR` and
          # `UNLOCALIZED_RESOURCES_FOLDER_PATH` from the environment, and its Kotlin target from
          # `PLATFORM_NAME`/`ARCHS`. Those are exactly what Xcode exports to a script phase, so
          # this task only works *here*; do not move it to a Gradle invocation Xcode does not run,
          # and do not pin the platform/arch with `-Pcompose.ios.resources.*`, which would hardcode
          # the simulator and break any device build.
          #
          # It resolves resources transitively from `:packages:design-system`, the single module
          # that configures `compose.resources`, so it is also the only place `:shared-ui` has to
          # be named.
          ./gradlew :shared-ui:linkDebugFrameworkIosSimulatorArm64 \
                    :shared-ui:syncComposeResourcesForIos --console=plain
        inputFiles: []

  TaskTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TaskTrackerUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: TaskTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tasktracker.app.uitests
        SWIFT_VERSION: "6.0"
        # The app target's Info.plist is written by hand, so it sets
        # GENERATE_INFOPLIST_FILE to NO. A test bundle has nothing to point at and needs
        # the generated one or it cannot be signed.
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TaskTracker

schemes:
  TaskTracker:
    build:
      targets:
        TaskTracker: all
    run:
      config: Debug
    test:
      config: Debug
      # Booting a simulator costs far more than the unit tests, so the UI bundle is a
      # deliberate step rather than part of every run - the same reasoning the original
      # records at project.yml:152-158.
      targets:
        - TaskTrackerUITests
